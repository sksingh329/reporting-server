services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  reporting-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/reporting.db   # absolute path inside container
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio123
      STORAGE_BUCKET: test-artifacts
      STORAGE_REGION: us-east-1
      PRESIGNED_URL_EXPIRY: "3600"
    volumes:
      - /Users/subodhsingh/Desktop/subodh/automation/projects/reporting-db:/data  # reporting.db lives on your host at ./data/reporting.db
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
